name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - run: npx cap sync android
      # Firebase config for native push: add repository secret GOOGLE_SERVICES_JSON (contents of google-services.json)
      - name: Write google-services.json
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then echo "$GSJ" > android/app/google-services.json; fi
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v5
        with:
          name: easy-life-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk EasyLife.apk
      # Public one-click download: /releases/latest/download/EasyLife.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Easy Life Android
          body: "Easy Life Android app — download EasyLife.apk and tap Install."
          make_latest: true
          files: EasyLife.apk
