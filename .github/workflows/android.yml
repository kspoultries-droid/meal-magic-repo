name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - run: mkdir -p android/app/src/main/assets
      - run: npx cap sync android
      # Firebase config for native push: add repository secret GOOGLE_SERVICES_JSON (contents of google-services.json)
      - name: Write google-services.json
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then
            printf '%s' "$GSJ" > android/app/google-services.json
            node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('android/app/google-services.json','utf8')); const id='app.lovable.p1324956aa36e44cebf0eabe4ab646da4'; if(!c.client?.some(x=>x.client_info?.android_client_info?.package_name===id)) throw new Error('Firebase Android package does not match Easy Life');"
          else
            echo "::error::GOOGLE_SERVICES_JSON is required. Refusing to publish an APK without Android push configuration."
            exit 1
          fi
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v5
        with:
          name: easy-life-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk EasyLife.apk
      # Public one-click download: /releases/latest/download/EasyLife.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Easy Life Android
          body: "Easy Life Android app — download EasyLife.apk and tap Install."
          make_latest: true
          files: EasyLife.apk
