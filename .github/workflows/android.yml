name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: android-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - run: mkdir -p android/app/src/main/assets
      - run: npx cap sync android
      # Firebase config for native push: add repository secret GOOGLE_SERVICES_JSON (contents of google-services.json)
      - name: Write google-services.json
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then
            printf '%s' "$GSJ" > android/app/google-services.json
            node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('android/app/google-services.json','utf8')); const id='app.lovable.p1324956aa36e44cebf0eabe4ab646da4'; if(!c.client?.some(x=>x.client_info?.android_client_info?.package_name===id)) throw new Error('Firebase Android package does not match Easy Life');"
          else
            echo "::error::GOOGLE_SERVICES_JSON is required. Refusing to publish an APK without Android push configuration."
            exit 1
          fi
      - run: chmod +x android/gradlew
      - name: Set Android update version
        run: |
          BUILD=$((100000 + ${{ github.run_number }}))
          echo "EASYLIFE_ANDROID_BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "EASYLIFE_ANDROID_VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"
      # Stable signing: the certificate lives in the repo, its password only in the ANDROID_KEYSTORE_PASSWORD secret.
      - name: Prepare signing key
        env:
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KSP" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD is required so new APKs install over the previous app."
            exit 1
          fi
          base64 -d android/app/easylife-release.p12.b64 > android/app/easylife-release.p12
          echo "EASYLIFE_KEYSTORE_PASSWORD=$KSP" >> "$GITHUB_ENV"
      - run: ./gradlew assembleRelease
        working-directory: android
      - name: Verify APK signature and version
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --print-certs "$APK" | tee cert.txt
          grep -qi "70:8b:51:c4:15:57:05:35:f8:cd:8f:38:0e:44:ac:f2:10:a8:39:44:6c:fc:07:51:6b:cf:77:fa:cc:02:53:00\|708b51c415570535f8cd8f380e44acf210a839446cfc07516bcf77facc025300" cert.txt
          $BT/aapt dump badging "$APK" | head -1 | grep -q "versionCode='$EASYLIFE_ANDROID_BUILD'"
      - uses: actions/upload-artifact@v5
        with:
          name: easy-life-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - run: cp android/app/build/outputs/apk/release/app-release.apk EasyLife.apk
      # Public one-click download: /releases/latest/download/EasyLife.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Easy Life Android
          body: "EasyLife-Android-Build: ${{ env.EASYLIFE_ANDROID_BUILD }}; Version: ${{ env.EASYLIFE_ANDROID_VERSION }}\nEasy Life Android app — download EasyLife.apk and tap Install."
          make_latest: true
          files: EasyLife.apk
